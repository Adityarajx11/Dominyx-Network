<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">Dominyx Network</title>
  <desc id="desc">A family of Discord bots sharing one Node.js core.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090b16"/>
      <stop offset="1" stop-color="#171b35"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <circle cx="1090" cy="120" r="210" fill="#8b5cf6" opacity=".12"/>
  <circle cx="180" cy="560" r="260" fill="#22d3ee" opacity=".08"/>
  <rect x="80" y="92" width="9" height="456" rx="4" fill="url(#accent)"/>
  <text x="136" y="245" fill="#f8fafc" font-family="Inter, Arial, sans-serif" font-size="78" font-weight="800">Dominyx</text>
  <text x="136" y="323" fill="#a5b4fc" font-family="Inter, Arial, sans-serif" font-size="48" font-weight="700">Network</text>
  <text x="136" y="401" fill="#cbd5e1" font-family="Inter, Arial, sans-serif" font-size="28">Six focused Discord bots. One shared Node.js core.</text>
  <g fill="#e2e8f0" font-family="Inter, Arial, sans-serif" font-size="22">
    <text x="136" y="486">Music</text><text x="270" y="486">Level</text><text x="395" y="486">Greet</text>
    <text x="530" y="486">Ticket</text><text x="680" y="486">Ping</text><text x="800" y="486">Guard</text>
  </g>
  <rect x="136" y="518" width="710" height="4" rx="2" fill="url(#accent)"/>
</svg>
