name: Mark inactive issues and pull requests

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          days-before-stale: 60
          days-before-close: 14
          stale-issue-label: stale
          stale-pr-label: stale
          exempt-issue-labels: pinned,security,in-progress
          exempt-pr-labels: pinned,security,in-progress
          stale-issue-message: >-
            This issue has been inactive for 60 days. It will remain open for another 14 days;
            please comment if it is still relevant or add the `pinned` label to keep it active.
          close-issue-message: >-
            Closing this inactive issue for now. If the problem is still present, please reopen it
            with current reproduction details.
